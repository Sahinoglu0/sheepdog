<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">Sheepdog flow</title><desc id="d">Card, worker, reviewer, verifier, dry run, merger, main branch. Incomplete work goes back to the worker. A watchdog checks every ten minutes.</desc>
  <style>
  .m{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;}
  .s{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;}
  .tx{fill:#e6edf3;} .mu{fill:#8b949e;} .ac{fill:#ffb000;} .ok{fill:#3fb950;}
  .cur{animation:blink 1.1s steps(1,end) infinite;}
  .akis{stroke-dasharray:5 7;animation:ak 1.2s linear infinite;}
  .nabiz{animation:nb 1.6s ease-in-out infinite;}
  @keyframes blink{0%,55%{opacity:1}56%,100%{opacity:0}}
  @keyframes ak{to{stroke-dashoffset:-24}}
  @keyframes nb{0%,100%{opacity:1}50%{opacity:.25}}
  @media (prefers-reduced-motion: reduce){ *{animation:none !important;} }
</style>
  <defs>
    <pattern id="gp" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#e6edf3" stroke-opacity="0.055" stroke-width="1"/></pattern>
    <linearGradient id="gmg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0.15"/><stop offset="0.55" stop-color="#fff" stop-opacity="0.6"/><stop offset="1" stop-color="#fff" stop-opacity="1"/></linearGradient>
    <mask id="gm"><rect width="1200" height="300" fill="url(#gmg)"/></mask>
  </defs>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="16" fill="#0b0f14" stroke="#262c36"/>
  <rect x="1" y="1" width="1198" height="298" rx="16" fill="url(#gp)" mask="url(#gm)"/>
  <defs><marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b949e"/></marker><marker id="oka" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ffb000"/></marker></defs>
  <rect x="32.0" y="120" width="140" height="64" rx="10" fill="#11161d" stroke="#262c36" stroke-width="1.5"/>
  <text x="102.0" y="148" text-anchor="middle" class="m tx" font-size="16" font-weight="700">card</text>
  <text x="102.0" y="169" text-anchor="middle" class="s mu" font-size="12.5">done-criteria written</text>
  <path d="M175.0 152.0H194.0" stroke="#8b949e" stroke-width="1.6" marker-end="url(#ok)"/>
  <rect x="198.0" y="120" width="140" height="64" rx="10" fill="#11161d" stroke="#ffb000" stroke-width="2"/>
  <text x="268.0" y="148" text-anchor="middle" class="m tx" font-size="16" font-weight="700">worker</text>
  <text x="268.0" y="169" text-anchor="middle" class="s mu" font-size="12.5">does the job</text>
  <path d="M341.0 152.0H360.0" stroke="#8b949e" stroke-width="1.6" marker-end="url(#ok)"/>
  <rect x="364.0" y="120" width="140" height="64" rx="10" fill="#11161d" stroke="#ffb000" stroke-width="2"/>
  <text x="434.0" y="148" text-anchor="middle" class="m tx" font-size="16" font-weight="700">reviewer</text>
  <text x="434.0" y="169" text-anchor="middle" class="s mu" font-size="12.5">was it really done?</text>
  <path d="M507.0 152.0H526.0" stroke="#8b949e" stroke-width="1.6" marker-end="url(#ok)"/>
  <rect x="530.0" y="120" width="140" height="64" rx="10" fill="#11161d" stroke="#ffb000" stroke-width="2"/>
  <text x="600.0" y="148" text-anchor="middle" class="m tx" font-size="16" font-weight="700">verifier</text>
  <text x="600.0" y="169" text-anchor="middle" class="s mu" font-size="12.5">runs the checks</text>
  <path d="M673.0 152.0H692.0" stroke="#8b949e" stroke-width="1.6" marker-end="url(#ok)"/>
  <rect x="696.0" y="120" width="140" height="64" rx="10" fill="#11161d" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="766.0" y="148" text-anchor="middle" class="m tx" font-size="16" font-weight="700">dry run</text>
  <text x="766.0" y="169" text-anchor="middle" class="s mu" font-size="12.5">any conflict?</text>
  <path d="M839.0 152.0H858.0" stroke="#8b949e" stroke-width="1.6" marker-end="url(#ok)"/>
  <rect x="862.0" y="120" width="140" height="64" rx="10" fill="#11161d" stroke="#ffb000" stroke-width="2"/>
  <text x="932.0" y="148" text-anchor="middle" class="m tx" font-size="16" font-weight="700">merger</text>
  <text x="932.0" y="169" text-anchor="middle" class="s mu" font-size="12.5">lands it</text>
  <path d="M1005.0 152.0H1024.0" stroke="#8b949e" stroke-width="1.6" marker-end="url(#ok)"/>
  <rect x="1028.0" y="120" width="140" height="64" rx="10" fill="#11161d" stroke="#3fb950" stroke-width="2"/>
  <text x="1098.0" y="148" text-anchor="middle" class="m ok" font-size="16" font-weight="700">main</text>
  <text x="1098.0" y="169" text-anchor="middle" class="s mu" font-size="12.5">if tests pass</text>
  <path d="M434.0 186V226" stroke="#ffb000" stroke-width="1.6" stroke-opacity="0.85" fill="none"/>
  <path d="M600.0 186V226" stroke="#ffb000" stroke-width="1.6" stroke-opacity="0.85" fill="none"/>
  <path d="M932.0 186V226" stroke="#ffb000" stroke-width="1.6" stroke-opacity="0.85" fill="none"/>
  <path d="M932.0 226H268.0V190" stroke="#ffb000" stroke-width="1.6" fill="none" class="akis" marker-end="url(#oka)"/>
  <text x="600.0" y="250" text-anchor="middle" class="s ac" font-size="14">if incomplete it returns to the same worker · after 3 rounds the decision is yours</text>
  <path d="M198.0 96V82H1002.0V96" stroke="#8b949e" stroke-width="1.4" stroke-dasharray="4 4" fill="none"/>
  <text x="600.0" y="70" text-anchor="middle" class="s mu" font-size="14"><tspan class="m tx" font-weight="700">watchdog</tspan>  checks every 10 min and reports closed or stuck sessions to Sheepdog</text>
  <rect x="32" y="28" width="22" height="14" rx="3" fill="none" stroke="#ffb000" stroke-width="2"/><text x="62" y="40" class="s mu" font-size="13.5">agent</text>
  <rect x="112" y="28" width="22" height="14" rx="3" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="4 3"/><text x="142" y="40" class="s mu" font-size="13.5">script, costs no model tokens</text>
  </svg>
