<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d"><title id="t">Card lifecycle</title><desc id="d">A job card moves through draft, ready, working, review, verify, merge queue, merging and done. Failed checks send it back to working; environment problems mark it stuck.</desc>
